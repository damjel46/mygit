<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width= device-width, initial - scale = 1.0">
        <title>Quiz2</title>
        <style>
            .top{
                margin-top: 15px;
                margin-bottom : 20px
            }
            label{
                margin-left: 15px;
            }
        </style>
    </head>
    <body>
        <form action="post">
            <fieldset>
                <legend>납품자정보</legend>
                <div class="top">
                    <label for="name">1. 납품자명 : </label>
                    <input type="text" id="name" name="name"><br><br>
                    <label for="email">2. email : </label>
                    <input type="email" id="email" name="email"><br><br>
                    <label for="homepage">3. 홈페이지 : </label>
                    <input type="text" id="page" name="page" value="http://"><br><br>
                    <label for="legion">4. 지역 : </label>
                    <select name="legion" id="legion">
                        <option value="default">서울</option>
                        <option value="default">부산</option>
                        <option value="default">광주</option>
                        <option value="default">청주</option>
                    </select>
                </div>
            </fieldset>
            <fieldset style="margin-top:15px">
                <legend>납품자정보</legend>
                <div class="top">
                    <label for="product">㉾ 상품정보 : </label>
                    <input type="text" id="product" name="product"> <br><br>
                    <label for="count">㉾ 납품수량</label>
                    <input type="number" id="count" name="count" placeholder="최소 100"> <br><br>
                    <label for="grade">㉾ 납품등급</label>
                    <input type="range" id="grade" name="grade"> <br><br>
                    <label for="other">㉾ 기타사항</label>
                    <textarea name="other" id="other" cols="20" rows="4"></textarea>
                </div>
            </fieldset>
            <br>
            <button>send messeage</button>
        </form>
    </body>
</html>
