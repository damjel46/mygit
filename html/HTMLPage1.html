<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네비게이션바</title>
    <style>
        .navbar{
            background-color: #333;
            padding: 10px;
            display: flex;
            justify-content:space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size:24px;
            font-weight:bold;
        }

        .menu{
            list-style:none;
            display:flex;
        }

        .menu li {
            margin: 0 15px;
        }

        .menu a {
            color:white;
            text-decoration:none;
            font-size:18px;
            transition:color 0.3s ease-in-out;
        }

        .menu a:hover{
            color: #ffcc00;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">mysite</div>
        <ul class="menu">
            <li><a href="#">홈</a></li>
            <li><a href="#">소개</a></li>
            <li><a href="#">서비스</a></li>
            <li><a href="#">연락처</a></li>
        </ul>
        

    </nav>
</body>
</html>
